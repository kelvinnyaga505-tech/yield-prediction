<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Crop Yield Prediction</title>

  <!-- Google Icons -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background-image: url('farm.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Dark overlay */
    body::before{
      content:'';
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
      z-index:-1;
    }

    header{
      text-align:center;
      color:white;
      padding:30px;
    }

    header h1{
      font-size:40px;
      margin-bottom:10px;
    }

    header p{
      font-size:18px;
    }

    .container{
      width:90%;
      max-width:650px;
      margin:20px auto;
      background:rgba(255,255,255,0.95);
      padding:35px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.4);
    }

    h2{
      text-align:center;
      color:green;
      margin-bottom:25px;
    }

    .form-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#333;
      font-size:17px;
    }

    label i{
      color:green;
      margin-right:8px;
    }

    input, select{
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
      transition:0.3s;
    }

    input:focus, select:focus{
      border-color:green;
      outline:none;
      box-shadow:0 0 5px green;
    }

    button{
      width:100%;
      padding:15px;
      background:green;
      color:white;
      border:none;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:darkgreen;
      transform:scale(1.02);
    }

    .result{
      margin-top:25px;
      padding:20px;
      background:#e8f5e9;
      border-left:6px solid green;
      border-radius:8px;
      display:none;
    }

    .result h3{
      color:green;
      margin-bottom:10px;
    }

    footer{
      text-align:center;
      color:white;
      padding:20px;
      margin-top:20px;
    }

  </style>
</head>

<body>
  

  <header>
    <h1>🌾 AI Crop Yield Prediction</h1>
    <p>Machine Learning Based Smart Farming System</p>
  </header>

  <div class="container">
     

    <h2>Enter Farm Information</h2>
  

    <form id="cropForm">
      <img src="28941461.jpg"

      <!-- Rainfall -->
      <div class="form-group">
        <label>
          <i class="fa-solid fa-cloud-rain"></i>
          Rainfall (mm)
        </label>

        <input type="number" id="rainfall"
        placeholder="Enter rainfall amount" required>
      </div>

      <!-- Humidity -->
      <div class="form-group">
        <label>
          <i class="fa-solid fa-water"></i>
          Humidity (%)
        </label>

        <input type="number" id="humidity"
        placeholder="Enter humidity level" required>
      </div>

      <!-- Crop Type -->
      <div class="form-group">
        <label>
          <i class="fa-solid fa-seedling"></i>
          Crop Type
        </label>

        <select id="cropType" required>
          <option value="">-- Select Crop --</option>
          <option value="Maize">🌽 Maize</option>
          <option value="Beans">🫘 Beans</option>
          <option value="Rice">🌾 Rice</option>
          <option value="Wheat">🌱 Wheat</option>
          <option value="Coffee">☕ Coffee</option>
        </select>
      </div>

      <!-- Temperature -->
      <div class="form-group">
        <label>
          <i class="fa-solid fa-temperature-high"></i>
          Temperature (°C)
        </label>

        <input type="number" id="temperature"
        placeholder="Enter temperature" required>
      </div>

      <!-- Soil PH -->
      <div class="form-group">
        <label>
          <i class="fa-solid fa-mountain"></i>
          Soil PH
        </label>

        <input type="number" step="0.1"
        id="soilph"
        placeholder="Enter soil PH" required>
      </div>

      <button type="submit">
        <i class="fa-solid fa-chart-line"></i>
        Predict Yield
      </button>

    </form>

    <!-- Result -->
    <div class="result" id="resultBox">

      <h3>
        <i class="fa-solid fa-leaf"></i>
        Prediction Result
      </h3>

      <p id="resultText"></p>

    </div>

  </div>

  <footer>
    <p>🌱 Smart Agriculture System using AI & Machine Learning</p>
  </footer>

  <script>



      document.getElementById("cropForm")
      .addEventListener("submit", async function(event){
      
          event.preventDefault();
      
          // Collect form data
          const data = {
      
              rainfall:
              document.getElementById("rainfall").value,
      
              humidity:
              document.getElementById("humidity").value,
      
              cropType:
              document.getElementById("cropType").value,
      
              temperature:
              document.getElementById("temperature").value,
      
              soilph:
              document.getElementById("soilph").value
          };
      
          // Send data to Flask backend
          const response = await fetch(
          "http://127.0.0.1:5000/predict",
      
          {
              method:"POST",
      
              headers:{
                  "Content-Type":"application/json"
              },
      
              body:JSON.stringify(data)
          });
      
          // Receive result
          const result = await response.json();
      
          // Display result
          document.getElementById("resultBox")
          .style.display = "block";
      
          document.getElementById("resultText")
          .innerHTML =
      
          "🌾 Predicted Yield for <b>" +
          result.crop +
          "</b> is approximately <b>" +
      
          result.prediction +
      
          " tons/hectare</b>";
      
      });
      
    
  </script>

</body>
</html>
